name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm run test
      
    - name: Check types
      run: npm run type-check
      
    - name: Run lint
      run: npm run lint
      
    - name: Build Next.js application
      run: npm run build
      
    # Add testing steps here once Vitest/Playwright are configured in later phases
