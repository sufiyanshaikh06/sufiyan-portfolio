name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Start Supabase
      run: npx supabase start
      
    - name: Seed Storage Fixtures
      run: npm run seed:storage
      
    - name: Run Database Tests (pgTAP)
      run: npx supabase test db
      
    - name: Run frontend and integration tests
      run: npm run test
      
    - name: Check types
      run: npm run type-check
      
    - name: Run lint
      run: npm run lint
      
    - name: Build Next.js application
      run: npm run build
