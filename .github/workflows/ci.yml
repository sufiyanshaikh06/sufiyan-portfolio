name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Start Supabase
      run: npx supabase start
      
    - name: Seed Storage Fixtures
      run: npm run seed:storage
      
    - name: Run Database Tests (pgTAP)
      run: npx supabase test db

    - name: Configure Supabase Environment
      run: |
        STATUS="$(npx supabase status -o env)"
        SUPABASE_URL_VALUE="$(printf '%s\n' "$STATUS" | grep '^API_URL=' | cut -d= -f2- | tr -d '"')"
        PUBLISHABLE_KEY_VALUE="$(printf '%s\n' "$STATUS" | grep '^PUBLISHABLE_KEY=' | cut -d= -f2- | tr -d '"')"

        {
          echo "SUPABASE_URL=$SUPABASE_URL_VALUE"
          echo "SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY_VALUE"
          echo "NEXT_PUBLIC_SITE_URL=https://sufiyan-shaikh-dev.vercel.app"
          echo "EXIT_GATE_ALLOW_LOCAL_STOP=1"
        } >> "$GITHUB_ENV"

    - name: Run Public Snapshot
      run: npm run snapshot:public
      
    - name: Run lint
      run: npm run lint
      
    - name: Check types
      run: npm run type-check

    - name: Run unit and integration tests
      run: npm run test

    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps

    - name: Build Next.js application
      run: npm run build:next

    - name: Verify Phase 3 Exit Gate
      run: npm run verify:gate
